<line x1="575" y1="355" x2="575" y2="511" class="arr"/>
<text x="570" y="492" text-anchor="end" class="ts">drives UI</text>

<rect x="400" y="512" width="220" height="50" rx="8" class="g"/>
<text x="510" y="534" text-anchor="middle" class="th" fill="#2C2C2A">Quality B2B back-office</text>
<text x="510" y="551" text-anchor="middle" class="ts" fill="#5F5E5A">legacy PHP · no API</text>

<rect x="60" y="580" width="12" height="12" rx="3" class="b"/>
