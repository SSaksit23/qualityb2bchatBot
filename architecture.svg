<text x="445" y="439" text-anchor="middle" class="ts" fill="#5F5E5A">append-only</text>

<line x1="300" y1="400" x2="447" y2="357" class="arr"/>
<text x="352" y="374" text-anchor="start" class="ts">approved</text>
