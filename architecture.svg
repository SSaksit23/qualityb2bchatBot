.box{fill:#ffffff;stroke:#5F5E5A;stroke-width:1.5}
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none;marker-end:url(#ah)}
.b{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5}
.bt{fill:#0C447C}.bs{fill:#185FA5}
.p{fill:#EEEDFE;stroke:#534AB7;stroke-width:1.5}
.pt{fill:#3C3489}.ps{fill:#534AB7}
.tl{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.5}
.tlt{fill:#085041}.tls{fill:#0F6E56}
.g{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1.5}
.gt{fill:#2C2C2A}.gs{fill:#5F5E5A}
</style>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5F5E5A" stroke-width="1.2"/></marker></defs>

