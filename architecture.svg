<svg width="100%" viewBox="0 0 680 610" role="img" xmlns="http://www.w3.org/2000/svg">
<title>LINE to Hermes to Quality B2B architecture</title>
<desc>Topology: LINE platform sends signed webhooks into a Hostinger VPS. A LINE gateway fans messages to an ingest worker and the Hermes agent. Ingest feeds a nightly KG builder and the Neo4j plus pgvector knowledge graph. Hermes retrieves from the graph and acts through a single-concurrency Playwright booking adapter, which drives the legacy Quality B2B back-office. A scheduler runs deadline sweeps, an approval store gates staged writes, and an audit log records every action.</desc>
